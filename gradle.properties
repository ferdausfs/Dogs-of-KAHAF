org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# v13 (2.1.3): suppressUnsupportedCompileSdk no longer needed —
# AGP 8.5.x officially supports compileSdk 35.

# Suppress Kotlin daemon warnings on first-time setup.
kotlin.daemon.jvmargs=-Xmx1536m

# Keep KSP incremental on for faster Hilt + Room codegen.
ksp.incremental=true
