name: Build Debug APK

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK 17 (required for AGP 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Set up Gradle 8.7 (AGP 8.5.2 requires Gradle 8.7+)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # 4. Create local.properties with GitHub Actions SDK path
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # 5. v13 (2.1.3): gradle-wrapper.jar is gitignored in this repo, so
      #    `./gradlew` would fail with "ClassNotFoundException:
      #    GradleWrapperMain". Regenerate the wrapper jar from the
      #    provisioned `gradle` binary (step 3) and make gradlew executable.
      - name: Generate Gradle wrapper jar
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew

      # 6. Accept Android SDK licenses (avoids first-time license prompt)
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # 6.5. v3.1.2 (FIX): Download NSFW TFLite model.
      #
      #  Priority:
      #    1. NSFW_MODEL_URL secret  — private/custom model (GitHub secret)
      #    2. Public HuggingFace MobileNetV2 fallback — always available,
      #       no secret needed. This ensures the bundled model is ALWAYS
      #       present so TfLiteNsfwClassifier never falls back to SAFE mode.
      #
      #  The HuggingFace model is a 2-class quantized MobileNetV2:
      #    index 0 = SFW, index 1 = NSFW
      #  It is matched by the map2ClassOutput() path in TfLiteNsfwClassifier.
      #
      #  NOTE: AiSettings.modelInputNormalized = true (v3.1.2 default) is
      #  correct for the float32 variant. The quantized model uses the uint8
      #  path which ignores normalization entirely (raw bytes, no NormalizeOp).
      - name: Download NSFW model
        run: |
          MODEL_URL="${{ secrets.NSFW_MODEL_URL }}"
          PUBLIC_FALLBACK="https://huggingface.co/s0md3v/ufal-nsfw-classifier/resolve/main/model.tflite"
          DEST="app/src/main/assets/nsfw_v1.tflite"
          mkdir -p "$(dirname "$DEST")"

          if [ -n "$MODEL_URL" ]; then
            echo "Downloading custom model from secret URL..."
            curl -L --fail --retry 3 -o "$DEST" "$MODEL_URL"
          else
            echo "NSFW_MODEL_URL secret not set — using public HuggingFace fallback"
            curl -L --fail --retry 3 -o "$DEST" "$PUBLIC_FALLBACK"
          fi

          if [ -f "$DEST" ]; then
            echo "Model downloaded: $(du -sh $DEST | cut -f1)"
          else
            echo "WARNING: model download failed — safe fallback will be used"
          fi

      # 7. Run unit tests (v3.1.1: re-enabled — OnboardingViewModelTest fixed)
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx2560m"

      # 8. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx2560m"

      # 9. Upload APK as downloadable artifact (name reflects current versionName)
      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dogs-of-KAHAF-v3.1.2-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      # 10. APK summary
      - name: APK summary
        if: success()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "Build complete!"
          ls -lh app/build/outputs/apk/debug/ || echo "(no APK found)"
          if [ -f "$APK" ]; then
            echo "APK size: $(du -sh $APK | cut -f1)"
          fi
          echo "Model bundled: $([ -f app/src/main/assets/nsfw_v1.tflite ] && echo YES || echo NO)"
