name: PR Compile Check

# Non-releasing CI for pull requests / in-flight work branches.
# Deliberately separate from build.yml (the release pipeline):
#   * builds assembleDebug ONLY — no keystore secrets needed,
#   * never triggers the release-tag guard (it only fires on
#     assembleRelease / bundleRelease),
#   * has no "Create GitHub Release" step.
# Release publication remains exclusively on main via build.yml.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [arena/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Read app version
        id: version
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "App version: $V"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile debug APK (unsigned; no release steps)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardian-shield-debug-v${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
